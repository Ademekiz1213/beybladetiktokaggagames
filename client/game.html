<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Beyblade TikTok Arena</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Canvas (oyun alanı) -->
    <canvas id="gameCanvas"></canvas>

    <!-- Event Feed (sağ alt) -->
    <div id="eventFeed" class="event-feed" style="display:none;">
        <div class="feed-header">📡 Canlı Etkinlik</div>
        <div id="feedList" class="feed-list"></div>
    </div>

    <!-- Aktif Oyuncu Sayısı -->
    <div id="playerCount" class="player-count" style="display:none;">
        <span class="count-icon">🌀</span>
        <span id="activeCount">0</span>
        <span class="count-label">Aktif</span>
    </div>

    <!-- Test Mode butonu -->
    <button id="testModeBtn" class="btn-test" style="display:none;" title="Test Modu">🧪 Test</button>

    <!-- Scripts - sıra önemli! -->
    <script src="js/firebase-config.js"></script>
    <script type="module" src="js/game-auth.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/arena.js"></script>
    <script src="js/beyblade.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/soundManager.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/giftConfig.js"></script>
    <script src="js/game.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
