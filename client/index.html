<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Arena Live</title>
    <link rel="stylesheet" href="css/auth.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card hero-card">
            <p class="eyebrow">TikTok Spin Arena</p>
            <h1>Canli savasa hos geldin</h1>
            <p class="auth-copy">
                Kayit ol, giris yap ve dashboard uzerinden oyuna baglan.
            </p>
            <p class="legal-note">
                Bu proje resmi bir marka/kurumla baglantili degildir. Yalnizca telif ve marka hakki ihlali icermeyen icerik kullanin.
            </p>

            <div class="auth-actions">
                <a class="btn btn-primary" href="/login.html">Giris Yap</a>
                <a class="btn btn-secondary" href="/register.html">Kayit Ol</a>
            </div>
        </section>
    </main>

    <script src="js/firebase-config.js"></script>
    <script type="module" src="js/welcome.js"></script>
</body>

</html>
